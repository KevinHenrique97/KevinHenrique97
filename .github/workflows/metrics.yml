name: Metrics
on:
  # Atualiza todo dia às 6h (UTC)
  schedule: [{ cron: "0 6 * * *" }]
  # Permite rodar manualmente pelo botão "Run workflow"
  workflow_dispatch:
  # Roda a cada push na main
  push: { branches: ["main"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Estatísticas do perfil
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: KevinHenrique97
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          # Inclui repositórios privados / de organização na contagem
          repositories_affiliations: owner, collaborator, organization_member
          # Linguagens mais usadas
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          # Linhas de código alteradas
          plugin_lines: yes
