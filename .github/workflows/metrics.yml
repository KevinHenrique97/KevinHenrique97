name: Metrics
on:
  # Atualiza todo dia às 6h (UTC)
  schedule: [{ cron: "0 6 * * *" }]
  # Permite rodar manualmente pelo botão "Run workflow"
  workflow_dispatch:

# Impede duas execuções empurrando ao mesmo tempo
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar estatísticas
        uses: lowlighter/metrics@latest
        with:
          # Usa o METRICS_TOKEN (se você criar um, conta os privados);
          # senão cai no token automático do GitHub e funciona só com o público.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: KevinHenrique97
          filename: github-metrics.svg
          output_action: none
          template: classic
          base: header, activity, repositories, metadata
          config_timezone: America/Sao_Paulo
          # Inclui repositórios privados / de organização na contagem (precisa do METRICS_TOKEN)
          repositories_affiliations: owner, collaborator, organization_member

      - name: Remover a linha "Pull requests reviewed"
        run: |
          python3 - << 'PY'
          import re
          f = "github-metrics.svg"
          s = open(f, encoding="utf-8").read()
          idx = s.find("Pull requests reviewed")
          if idx == -1:
              print("Texto não encontrado (ok se já removido).")
          else:
              opens = [m.start() for m in re.finditer(r'<div class="field', s[:idx])]
              start = opens[-1]
              end = s.find("</div>", idx) + len("</div>")
              s = s[:start] + s[end:]
              open(f, "w", encoding="utf-8").write(s)
              print("Linha 'Pull requests reviewed' removida.")
          PY

      - name: Commitar imagem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          if git diff --cached --quiet; then
            echo "Sem mudanças."
            exit 0
          fi
          git commit -m "Update github-metrics.svg [Skip GitHub Action]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Push ok (tentativa $attempt)."
              exit 0
            fi
            echo "Push falhou, tentando de novo ($attempt)..."
            sleep 3
          done
          echo "Não foi possível empurrar após 5 tentativas." >&2
          exit 1
