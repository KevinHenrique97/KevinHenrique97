name: Metrics
on:
  # Atualiza todo dia às 6h (UTC)
  schedule: [{ cron: "0 6 * * *" }]
  # Permite rodar manualmente pelo botão "Run workflow"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Estatísticas do perfil
        uses: lowlighter/metrics@latest
        with:
          # Usa o METRICS_TOKEN (se você criar um, conta os privados);
          # senão cai no token automático do GitHub e funciona só com o público.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: KevinHenrique97
          filename: github-metrics.svg
          template: classic
          base: header, activity, repositories, metadata
          config_timezone: America/Sao_Paulo
          # Inclui repositórios privados / de organização na contagem (precisa do METRICS_TOKEN)
          repositories_affiliations: owner, collaborator, organization_member
